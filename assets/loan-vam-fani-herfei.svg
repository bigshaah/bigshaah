  <circle cx="1180" cy="20" r="60" fill="none" stroke="#FFCC00" stroke-width="8"/>
  <rect y="616" width="1200" height="14" fill="#FFCC00"/>
  <text x="600" y="185" text-anchor="middle" font-family="Tahoma, 'Noto Sans Arabic', sans-serif" font-size="78" font-weight="bold" fill="#FFCC00">وام ۲۰۰ تا ۵۰۰ میلیون تومان</text>
